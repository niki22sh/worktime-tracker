name: CI Pipeline — Worktime Tracker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-analyze:
    name: Build · Test · Analyze
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      # ─── 2. Setup Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── 3. Setup Java 17 for SonarScanner ────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─── 5. Run tests with coverage ────────────────────────────────────────
      - name: Run tests & generate coverage
        run: npm run test:ci
        env:
          CI: true

      # ─── 6. Upload HTML coverage report artifact ───────────────────────────
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: coverage-html-report
          path: coverage/lcov-report/
          retention-days: 30

      # ─── 7. Upload XML/JUnit reports artifact ──────────────────────────────
      - name: Upload JUnit & Cobertura XML reports
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: test-xml-reports
          path: |
            reports/junit.xml
            coverage/cobertura-coverage.xml
            coverage/lcov.info
          retention-days: 30

      # ─── 8. Download and run SonarScanner CLI directly ────────────────────
      - name: SonarCloud Scan
        run: |
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner.zip
          ./sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
