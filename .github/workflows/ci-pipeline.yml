name: CI Pipeline — Worktime Tracker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-analyze:
    name: Build · Test · Analyze
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for SonarCloud blame data

      # ─── 2. Setup Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─── 4. Run tests with coverage ────────────────────────────────────────
      - name: Run tests & generate coverage
        run: npm run test:ci
        env:
          CI: true

      # ─── 5. Upload HTML coverage report artifact ───────────────────────────
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: coverage/lcov-report/
          retention-days: 30

      # ─── 6. Upload XML/JUnit reports artifact ──────────────────────────────
      - name: Upload JUnit & Cobertura XML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-xml-reports
          path: |
            reports/junit.xml
            coverage/cobertura-coverage.xml
            coverage/lcov.info
          retention-days: 30

      # ─── 7. SonarCloud analysis ────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ─── 8. Quality Gate check ─────────────────────────────────────────────
      - name: Check SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ─── PR Merge Protection ────────────────────────────────────────────────────
  # Branch protection rules should require this job to pass before merging.
  # Configure in: Settings → Branches → Branch protection rules → Require status checks

