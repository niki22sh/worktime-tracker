name: CI Pipeline — Worktime Tracker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-analyze:
    name: Build · Test · Analyze
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      # ─── 2. Setup Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── 3. Setup Java (required by SonarScanner CLI) ──────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ─── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─── 5. Run tests with coverage ────────────────────────────────────────
      - name: Run tests & generate coverage
        run: npm run test:ci
        env:
          CI: true

      # ─── 6. Upload HTML coverage report artifact ───────────────────────────
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: coverage-html-report
          path: coverage/lcov-report/
          retention-days: 30

      # ─── 7. Upload XML/JUnit reports artifact ──────────────────────────────
      - name: Upload JUnit & Cobertura XML reports
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: test-xml-reports
          path: |
            reports/junit.xml
            coverage/cobertura-coverage.xml
            coverage/lcov.info
          retention-days: 30

      # ─── 8. SonarCloud analysis ────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@2500896589ef8f7247069a56136f8dc177c27ccf # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ─── 9. Quality Gate check ─────────────────────────────────────────────
      - name: Check SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@d304d050d14f39b3cd56a37c8fa0c88a21c64ea6 # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


